<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Akční Rohlík">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#b3202d"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.55" stop-color="#f0a53a"/>
      <stop offset="1" stop-color="#d9831c"/>
    </linearGradient>
    <path id="crescent" d="M9 47C7 27 19 12 32 12s25 15 23 35c-5-8-11-12-23-12S14 39 9 47Z"/>
    <clipPath id="crescent-clip"><use href="#crescent"/></clipPath>
  </defs>
  <!-- štít: hrdinský znak -->
  <path d="M32 2.5 59 11.5V32c0 15.5-12 25.5-27 29.5C17 57.5 5 47.5 5 32V11.5L32 2.5Z" fill="url(#shield)" stroke="#ffd23f" stroke-width="3" stroke-linejoin="round"/>
  <!-- rohlík: plný půlměsíc, zářezy se rozbíhají od středu -->
  <g clip-path="url(#crescent-clip)">
    <rect x="6" y="10" width="52" height="40" fill="url(#roll)"/>
    <g stroke="#a35a12" stroke-width="1.8" stroke-linecap="round">
      <path d="M27.6 38.5 20.4 9.4"/>
      <path d="M36.4 38.5 43.6 9.4"/>
      <path d="M21.9 41.1 5.2 16.2"/>
      <path d="M42.1 41.1 58.8 16.2"/>
    </g>
    <path d="M13 32C16 21 23 16.5 31 16" stroke="#fff3cf" stroke-opacity=".75" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>
  <use href="#crescent" fill="none" stroke="#a35a12" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- rychlostní čáry: akce -->
  <g stroke="#ffd23f" stroke-width="2.2" stroke-linecap="round">
    <path d="M22 52.500h20"/>
    <path d="M27 56.500h10"/>
  </g>
</svg>
